services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: v3
      POSTGRES_PASSWORD: v3
      POSTGRES_DB: v3_aidlc
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U v3 -d v3_aidlc']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - v3-postgres:/var/lib/postgresql/data

volumes:
  v3-postgres:
